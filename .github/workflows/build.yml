name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Uloz pliki w foldery
        run: |
          J=src/main/java/pl/easybot
          R=src/main/resources
          mkdir -p $J/bot $J/screen $J/util $R/assets/easybot/lang
          mv_if() { [ -f "$1" ] && mv "$1" "$2"/ || true; }
          for f in Bot BotManager LogLine; do mv_if $f.java $J/bot; done
          for f in BotScreen ErrorsScreen ConsoleScreen; do mv_if $f.java $J/screen; done
          for f in Config EasyBotMod; do mv_if $f.java $J; done
          for f in LogView Texts Ui; do mv_if $f.java $J/util; done
          mv_if fabric.mod.json $R
          mv_if en_us.json $R/assets/easybot/lang
          mv_if pl_pl.json $R/assets/easybot/lang
          find src -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: EasyBot-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
