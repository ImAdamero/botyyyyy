plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'OpenCollab'
        url = 'https://repo.opencollab.dev/main/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Klient protokolu Minecrafta dla botow - pakowany do jara (jar-in-jar)
    implementation "org.geysermc.mcprotocollib:protocol:${project.mcpl_version}"
    include "org.geysermc.mcprotocollib:protocol:${project.mcpl_version}"
}

// Biblioteki, ktore Minecraft juz dostarcza - nie pakujemy ich drugi raz
configurations.include {
    exclude group: 'io.netty'
    exclude group: 'com.google.code.gson'
    exclude group: 'com.google.guava'
    exclude group: 'it.unimi.dsi'
    exclude group: 'org.slf4j'
    exclude group: 'org.apache.logging.log4j'
    exclude group: 'org.jetbrains', module: 'annotations'
    exclude group: 'com.google.code.findbugs'
    exclude group: 'org.checkerframework'
    exclude group: 'com.google.errorprone'
    exclude group: 'commons-io'
    exclude group: 'org.apache.commons'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
