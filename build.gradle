plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'OpenCollab'
        url = 'https://repo.opencollab.dev/main/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Klient protokolu Minecrafta dla botow - jego klasy wkladamy prosto do jara (nizej)
    implementation "org.geysermc.mcprotocollib:protocol:${project.mcpl_version}"
}

// Biblioteki, ktorych Minecraft NIE ma - wkladamy je do jara moda
// (netty, gson, fastutil, slf4j itd. dostarcza Minecraft, wiec ich tu nie ma)
def shadePrefixes = [
        'org.geysermc.mcprotocollib:',
        'net.kyori:',
        'org.cloudburstmc:',
        'org.cloudburstmc.'
]

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.incoming.artifacts.artifacts
                .findAll { a ->
                    def name = a.id.componentIdentifier.displayName
                    shadePrefixes.any { p -> name.startsWith(p) }
                }
                .collect { a -> zipTree(a.file) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
